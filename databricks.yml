# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_citybike

include:
  - resources/*.yml

variables:
  catalog:
    default: "citibike_dev"
  dev_flag:
    default: true

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405617671970223.3.azuredatabricks.net
    permissions:
      - service_principal_name: e5dabfef-95fb-4ff4-9a2f-bebc02f3eb63
        level : CAN_MANAGE
    run_as:
      service_principal_name: e5dabfef-95fb-4ff4-9a2f-bebc02f3eb63

  test:
      mode: production
      variables:
        catalog:
        default: "citibike_test"
        dev_flag:
         default: false
      presets:
        name_prefix: '[testing] '
      workspace:
        host: https://adb-7405605925020159.19.azuredatabricks.net
        root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
        # Or you can reference your CLI profile:
        # profile: test
      permissions:
        - service_principal_name: 73ef05bc-da0d-49e6-9c71-8f032084afaa
          level : CAN_MANAGE
      run_as:
        service_principal_name: 73ef05bc-da0d-49e6-9c71-8f032084afaa